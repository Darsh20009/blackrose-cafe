    <!-- ═══════════════════════════════════════════════════════════
         ONE-TIME CACHE CLEANER
         لمسح الكاش من كل المتصفحات مرة واحدة فقط عند التحديث
         لتشغيل تنظيف جديد: غيّر CLEAR_VERSION إلى رقم جديد
         ═══════════════════════════════════════════════════════════ -->
    <script>
      (function() {
        var CLEAR_VERSION = 'br-replit-dev-2026-04-13-v1';
        var CLEAR_KEY = 'br_clear_version';
        try {
          if (localStorage.getItem(CLEAR_KEY) !== CLEAR_VERSION) {
            // 1. مسح كل الكوكيز
            document.cookie.split(';').forEach(function(cookie) {
              var name = cookie.split('=')[0].trim();
              if (name) {
                var expiry = 'expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
                document.cookie = name + '=;' + expiry;
                document.cookie = name + '=;' + expiry + ';domain=' + location.hostname;
                document.cookie = name + '=;' + expiry + ';domain=.' + location.hostname;
              }
            });
            // 2. مسح كل الكاش من الـ Service Worker
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            // 3. إلغاء تسجيل الـ Service Workers القديمة
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(reg) { reg.unregister(); });
              });
            }
            // 4. حفظ رقم الإصدار الجديد حتى لا يتكرر التنظيف
            localStorage.setItem(CLEAR_KEY, CLEAR_VERSION);
            // 5. إعادة تحميل الصفحة بعد التنظيف
            setTimeout(function() { location.reload(true); }, 200);
          }
        } catch(e) {}
      })();
    </script>

    <!-- Dynamic Manifest Switcher for Employee Portal -->
    <script>
      (function() {
        const employeePaths = ['/employee', '/manager', '/kitchen', '/pos', '/cashier', '/admin', '/owner', '/executive'];
        const currentPath = window.location.pathname;
        const isEmployeePath = employeePaths.some(path => currentPath === path || currentPath.startsWith(path + '/'));
        
        const manifestLink = document.getElementById('main-manifest');
        const favicon = document.getElementById('main-favicon');
        const shortcutIcon = document.getElementById('main-shortcut-icon');
        const appleTouchIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');

        if (isEmployeePath) {
          if (manifestLink) manifestLink.href = '/employee-manifest.json';
          if (favicon) favicon.href = '/employee-logo-192.png';
          if (shortcutIcon) shortcutIcon.href = '/employee-logo-192.png';
          appleTouchIcons.forEach(icon => {
            icon.href = '/employee-logo-192.png';
          });
          
          const existingIcon = document.querySelector('link[rel="icon"]');
          if (existingIcon) existingIcon.href = '/employee-logo-192.png';
          
          document.title = "BLACK ROSE SYSTEMS | نظام إدارة الموظفين";
          
          if (manifestLink) {
             const newManifest = manifestLink.cloneNode(true);
             newManifest.href = '/employee-manifest.json?v=' + Date.now();
             manifestLink.parentNode.replaceChild(newManifest, manifestLink);
          }
        } else {
          if (manifestLink) manifestLink.href = '/manifest.json';
          if (favicon) favicon.href = '/logo-192.png';
          if (shortcutIcon) shortcutIcon.href = '/logo-192.png';
          appleTouchIcons.forEach(icon => {
            icon.href = '/apple-touch-icon.png';
          });
          const existingIcon = document.querySelector('link[rel="icon"]');
          if (existingIcon) existingIcon.href = '/logo-32.png';
        }
      })();
    </script>

            .then(function(registration) {
              console.log('ServiceWorker registration successful');
              if ("Notification" in window) {
                Notification.requestPermission();
              }
            })
            .catch(function(err) {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
