workflows:
  ios-release:
    name: iOS Release Build (App Store / TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Create this integration in Codemagic: Teams ▸ Integrations ▸ App Store Connect
      app_store_connect: blackrose_appstore
    environment:
      xcode: latest
      node: 20
      cocoapods: default
      groups:
        # Create this variable group in Codemagic with these vars:
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_ISSUER_ID
        #   APP_STORE_CONNECT_PRIVATE_KEY
        #   APPLE_TEAM_ID            (e.g. V4K6RM59LS)
        #   CERTIFICATE_PRIVATE_KEY  (generated by `ssh-keygen -t rsa`)
        - apple_credentials
      vars:
        BUNDLE_ID: "com.blackrose.cafe"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_NAME: "BlackRose Cafe"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor with iOS
        script: |
          npx cap sync ios

      - name: Bump iOS minimum deployment target to 14.0
        script: |
          cd ios/App
          if [ -f Podfile ]; then
            # Works on both macOS and Linux variants of sed
            sed -i '' "s/platform :ios, .*/platform :ios, '14.0'/" Podfile 2>/dev/null || \
              sed -i "s/platform :ios, .*/platform :ios, '14.0'/" Podfile
          fi

      - name: Inject Info.plist permission strings & encryption flag
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'يستخدم التطبيق الكاميرا لمسح رموز QR لتأكيد الطلبات والولاء'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'يستخدم التطبيق الكاميرا لمسح رموز QR لتأكيد الطلبات والولاء'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'يستخدم التطبيق الموقع لإيصال الطلب وعروض الفروع القريبة منك'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'يستخدم التطبيق الموقع لإيصال الطلب وعروض الفروع القريبة منك'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'يستخدم التطبيق الصور لرفع إيصالات الدفع'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'يستخدم التطبيق الصور لرفع إيصالات الدفع'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSUserNotificationsUsageDescription string 'لإرسال إشعارات بحالة الطلب والعروض'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSUserNotificationsUsageDescription 'لإرسال إشعارات بحالة الطلب والعروض'" "$PLIST"
          # Skip the "export compliance" question every release (no custom crypto used)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Sync versioning (CFBundleShortVersionString from package.json, build = Codemagic build #)
        script: |
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1))
          echo "Marketing version: $MARKETING_VERSION   Build: $BUILD_NUMBER"
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install --repo-update

      - name: Fetch / generate signing files (App Store Connect)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA (App Store)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        # Codemagic will use the integration above to upload to TestFlight automatically
        auth: integration
        submit_to_testflight: true
        # Uncomment to also submit for App Store review automatically:
        # submit_to_app_store: true
        # release_type: AFTER_APPROVAL  # or SCHEDULED / MANUAL

      email:
        recipients:
          - cafe@qiroxstudio.online
        notify:
          success: true
          failure: true
