workflows:

  # ─────────────────────────────────────────────────────────────
  # WORKFLOW 1 — Build only (no App Store credentials needed)
  # Use this to verify the build pipeline works before adding
  # your Apple credentials.
  # ─────────────────────────────────────────────────────────────
  ios-build:
    name: iOS Build (No Signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 20
      cocoapods: default
      vars:
        BUNDLE_ID: "com.blackrose.cafe"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Add iOS platform if missing (skip pod install)
        script: |
          if [ ! -d "ios" ]; then
            # cap add runs pod install internally — ignore that failure,
            # we will patch the Podfile and run pod install ourselves below.
            npx cap add ios || true
          fi

      - name: Set minimum iOS deployment target to 16.0
        # Must run BEFORE cap sync and BEFORE pod install
        script: |
          cd ios/App
          if [ -f Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '16.0'/" Podfile 2>/dev/null || \
              sed -i    "s/platform :ios, .*/platform :ios, '16.0'/" Podfile
          fi
          # Also patch the Xcode project file directly
          find . -name "project.pbxproj" -exec \
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' {} + 2>/dev/null || \
          find . -name "project.pbxproj" -exec \
            sed -i    's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' {} +

      - name: Sync Capacitor with iOS (skip CocoaPods — we run it below)
        script: |
          npx cap sync ios --no-deps

      - name: Inject Info.plist permission strings & encryption flag
        script: |
          PLIST="ios/App/App/Info.plist"
          # Camera — QR scanner
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'يستخدم التطبيق الكاميرا لمسح رموز QR'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'يستخدم التطبيق الكاميرا لمسح رموز QR'" "$PLIST"
          # Location — delivery and branch finder
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'يستخدم التطبيق الموقع لإيصال الطلبات وإيجاد الفروع القريبة'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'يستخدم التطبيق الموقع لإيصال الطلبات وإيجاد الفروع القريبة'" "$PLIST"
          # Photo library — upload payment receipts
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'يستخدم التطبيق الصور لرفع إيصالات الدفع'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'يستخدم التطبيق الصور لرفع إيصالات الدفع'" "$PLIST"
          # Encryption compliance — only standard HTTPS, no custom encryption
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install --repo-update

      - name: Build (unsigned — simulator archive to verify the pipeline)
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            | xcpretty

    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # ─────────────────────────────────────────────────────────────
  # WORKFLOW 2 — App Store release (requires Apple credentials)
  # Steps to enable:
  #  1. Codemagic → Teams → Integrations → App Store Connect
  #     Create integration, name it: blackrose_appstore
  #  2. Codemagic → Teams → Environment variables
  #     Create group named: apple_credentials
  #     Add: APPLE_TEAM_ID = V4K6RM59LS
  #          CERTIFICATE_PRIVATE_KEY = (RSA private key)
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: blackrose_appstore   # Create this in Codemagic UI first
    environment:
      xcode: latest
      node: 20
      cocoapods: default
      groups:
        - apple_credentials                   # Create this in Codemagic UI first
      vars:
        BUNDLE_ID: "com.blackrose.cafe"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Add iOS platform if missing (skip pod install)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi

      - name: Set minimum iOS deployment target to 16.0
        # Must run BEFORE cap sync and BEFORE pod install
        script: |
          cd ios/App
          if [ -f Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '16.0'/" Podfile 2>/dev/null || \
              sed -i    "s/platform :ios, .*/platform :ios, '16.0'/" Podfile
          fi
          find . -name "project.pbxproj" -exec \
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' {} + 2>/dev/null || \
          find . -name "project.pbxproj" -exec \
            sed -i    's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' {} +

      - name: Sync Capacitor with iOS (skip CocoaPods — we run it below)
        script: |
          npx cap sync ios --no-deps

      - name: Inject Info.plist permission strings & encryption flag
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'يستخدم التطبيق الكاميرا لمسح رموز QR'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'يستخدم التطبيق الكاميرا لمسح رموز QR'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'يستخدم التطبيق الموقع لإيصال الطلبات وإيجاد الفروع القريبة'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'يستخدم التطبيق الموقع لإيصال الطلبات وإيجاد الفروع القريبة'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'يستخدم التطبيق الصور لرفع إيصالات الدفع'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'يستخدم التطبيق الصور لرفع إيصالات الدفع'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Sync versioning
        script: |
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1))
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install --repo-update

      - name: Fetch signing certificates (App Store)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: true
      email:
        recipients:
          - cafe@qiroxstudio.online
        notify:
          success: true
          failure: true
