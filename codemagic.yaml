workflows:

  # ─────────────────────────────────────────────────────────────
  # WORKFLOW 1 — iOS App Store / TestFlight (Flutter)
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release — App Store / TestFlight (Flutter)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_app

    integrations:
      app_store_connect: blackrose_appstore

    environment:
      flutter: stable
      xcode: 26
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: blackrose.com.sa

      vars:
        BUNDLE_ID: "blackrose.com.sa"
        APPLE_TEAM_ID: "V4K6RM59LS"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Flutter pub get
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Add certificates
        script: keychain add-certificates

      - name: Set Xcode signing
        script: xcode-project use-profiles

      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=$(cat pubspec.yaml | grep "^version:" | awk '{print $2}' | cut -d+ -f1) \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ─────────────────────────────────────────────────────────────
  # WORKFLOW 2 — Android Google Play Internal (Flutter)
  # ─────────────────────────────────────────────────────────────
  android-release:
    name: Android Release — Google Play Internal (Flutter)
    max_build_duration: 90
    instance_type: linux_x2
    working_directory: flutter_app

    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "blackrose.com.sa"

    scripts:
      - name: Set up keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > keystore.jks
          echo "storeFile=$(pwd)/keystore.jks"    > android/key.properties
          echo "storePassword=$CM_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS"           >> android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD"     >> android/key.properties

      - name: Flutter pub get
        script: flutter pub get

      - name: Build App Bundle
        script: |
          flutter build appbundle \
            --release \
            --build-name=$(cat pubspec.yaml | grep "^version:" | awk '{print $2}' | cut -d+ -f1) \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # ─────────────────────────────────────────────────────────────
  # WORKFLOW 3 — iOS Build Only (no signing, for testing)
  # ─────────────────────────────────────────────────────────────
  ios-build:
    name: iOS Build Only — No Signing (Flutter)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: flutter_app

    environment:
      flutter: stable
      xcode: 26
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build iOS (no codesign)
        script: |
          flutter build ios \
            --release \
            --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
